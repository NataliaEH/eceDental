<?xml version="1.0" encoding="UTF-8"?>
<ui:composition template="/WEB-INF/plantillas/plantilla.xhtml" xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core" xmlns:ui="jakarta.faces.facelets" xmlns:pt="jakarta.faces.passthrough">
    <ui:param name="activo" value="buscarExpediente"/>
    <ui:define name="titulo">Expedientes Clínicos</ui:define>
    <ui:define name="contenido">
        <div class="page-header"><div><h2>Expedientes Clínicos</h2><p>Búsqueda y gestión de expedientes</p></div></div>
        <form method="get" action="buscarExpediente.xhtml">
            <div class="card"><div class="card-header"><h2>Buscar expediente</h2></div><div class="card-body">
                <div class="form-grid">
                    <div class="form-group"><label>Nombre paciente</label><input type="text" name="nombre" value="#{param.nombre}" placeholder="Nombre o apellido..."/></div>
                    <div class="form-group"><label>Última consulta (última nota de evolución)</label><input type="date" name="fecha" value="#{param.fecha}"/></div>
                </div>
                <div class="btn-group" style="margin-top:14px"><button type="submit" class="btn btn-primary">Buscar</button><h:link outcome="buscarExpediente" value="Limpiar" styleClass="btn btn-muted"/></div>
            </div></div>
        </form>
        <div class="card"><div class="table-wrap"><table>
            <thead><tr><th>Paciente ↕</th><th>Fecha de última consulta ↕</th><th>Fecha de creación</th><th>Acciones</th></tr></thead>
            <tbody>
            <ui:repeat value="#{beanExpediente.consultar()}" var="e">
                <ui:fragment rendered="#{empty param.nombre or e.paciente.nombre.toLowerCase().contains(param.nombre.toLowerCase())}">
                    <tr><td>#{e.paciente.nombre}</td><td><h:outputText value="#{e.notasEvolucion.stream().map(n -> n.fecha).max().orElse(null)}"><f:convertDateTime pattern="yyyy-MM-dd"/></h:outputText></td><td><h:outputText value="#{e.fechaCreacion}"><f:convertDateTime pattern="yyyy-MM-dd"/></h:outputText></td><td><h:link outcome="dashboardExpediente" value="Ver" styleClass="btn btn-sm btn-secondary"><f:param name="id" value="#{e.idExpediente}"/></h:link></td></tr>
                </ui:fragment>
            </ui:repeat>
            </tbody>
        </table></div></div>
    </ui:define>
</ui:composition>
