<?xml version="1.0" encoding="UTF-8"?>
<ui:composition template="/WEB-INF/plantillas/plantilla.xhtml" xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core" xmlns:ui="jakarta.faces.facelets" xmlns:pt="jakarta.faces.passthrough">
    <ui:param name="tab" value="datosGenerales"/>
    <ui:define name="titulo">Datos Generales del Paciente</ui:define>
    <ui:define name="navbar"><ui:include src="/WEB-INF/includes/navbar.xhtml"/></ui:define>
    <ui:define name="contenido">
        <div class="page-header"><div><h2>Datos Generales del Paciente</h2><p>#{beanExpediente.buscar(param.id).paciente.nombre}</p></div></div>
        <h:form>
            <input type="hidden" name="id" value="#{param.id}"/>
            <fieldset class="form-section"><legend>Datos Personales</legend><div class="form-grid">
                <div class="form-group span-2"><label>Nombre completo *</label><h:inputText value="#{beanPaciente.paciente.nombre}" pt:required="true" pt:placeholder="Nombre(s) Apellido Paterno Apellido Materno"/></div>
                <div class="form-group"><label>Edad *</label><h:inputText value="#{beanPaciente.paciente.edad}" pt:type="number" pt:min="0" pt:max="120" pt:required="true" pt:placeholder="Años"/></div>
                <div class="form-group"><label>Sexo *</label><h:selectOneRadio value="#{beanPaciente.paciente.sexo}" layout="lineDirection" styleClass="check-group" required="true" requiredMessage="Seleccione el sexo del paciente"><f:selectItem itemLabel="Masculino" itemValue="M"/><f:selectItem itemLabel="Femenino" itemValue="F"/></h:selectOneRadio></div>
                <div class="form-group"><label>Estado civil</label><h:selectOneMenu value="#{beanPaciente.paciente.edoCivil}"><f:selectItem itemLabel="-- Seleccionar --" itemValue="" noSelectionOption="true"/><f:selectItems value="#{['Soltero/a','Casado/a','Divorciado/a','Viudo/a','Unión libre']}"/></h:selectOneMenu></div>
                <div class="form-group"><label>Ocupación</label><h:inputText value="#{beanPaciente.paciente.ocupacion}" pt:placeholder="Ej. Empleado, Estudiante..."/></div>
                <div class="form-group"><label>Domicilio</label><h:inputText value="#{beanPaciente.paciente.domicilio}" pt:placeholder="Calle, Número, Colonia"/></div>
            </div></fieldset>
            <fieldset class="form-section"><legend>Contacto</legend><div class="form-grid cols-3">
                <div class="form-group"><label>Teléfono principal *</label><h:inputText value="#{beanPaciente.paciente.telefonos[0]}" pt:type="tel" pt:required="true" pt:placeholder="664-XXX-XXXX"/></div>
                <div class="form-group"><label>Teléfono alternativo</label><h:inputText value="#{beanPaciente.paciente.telefonos[1]}" pt:type="tel" pt:placeholder="664-XXX-XXXX"/></div>
                <div class="form-group"><label>Correo *</label><h:inputText value="#{beanPaciente.paciente.correo}" pt:type="email" pt:required="true" pt:placeholder="correo@direccion.com"/></div>
            </div></fieldset>
            <fieldset class="form-section"><legend>Fecha de Registro</legend><div class="form-grid">
                <div class="form-group"><label>Fecha de primera consulta *</label><h:inputText value="#{beanPaciente.paciente.expediente.fechaCreacion}" pt:type="date" pt:required="true"><f:convertDateTime pattern="yyyy-MM-dd"/></h:inputText></div>
            </div></fieldset>
            <div class="btn-group"><h:commandButton value="Guardar datos generales" action="#{beanPaciente.modificar}" styleClass="btn btn-primary"/><h:link outcome="dashboardExpediente" value="Cancelar" styleClass="btn btn-muted"><f:param name="id" value="#{param.id}"/></h:link></div>
        </h:form>
    </ui:define>
</ui:composition>
