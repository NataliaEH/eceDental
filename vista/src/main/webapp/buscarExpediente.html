<!DOCTYPE html>
<html lang="es">
<head>
    <title>Expedientes Clínicos - eceDental</title>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&amp;family=Source+Sans+3:wght@300;400;600&amp;display=swap" rel="stylesheet"/><link rel="stylesheet" href="resources/css/estilos.css"/>
    <script src="resources/js/alertas.js"></script>
    <script src="resources/js/buscarExpediente.js"></script>
</head>
<body>
<aside class="sidebar">
    <div class="sidebar-brand">
        <img src="resources/img/logo.png" alt="eceDental - Gestión de expedientes" class="sidebar-logo"/>
        <p class="sidebar-user">Natalia Escobar Hernández</p>
    </div>
    <nav>
        <div class="nav-section-label">General</div>
        <a href="panelPrincipal.html" class="nav-link">Panel Principal</a>
        <div class="nav-section-label">Expedientes</div>
        <a href="registrarPaciente.html" class="nav-link">Registrar Paciente</a>
        <a href="buscarExpediente.html" class="nav-link active">Buscar Expediente</a>
        <div class="nav-section-label">Herramientas</div>
        <a href="recordatorios.html" class="nav-link">Recordatorios</a>
        <a href="misDatos.html" class="nav-link">Mis Datos</a>
    </nav>
    <div class="sidebar-footer">Sistema v1.2 - LSC</div>
</aside>
<div class="main">
    <div class="content">
        <div class="page-header">
            <div>
                <h2>Expedientes Clínicos</h2><p>Búsqueda y gestión de expedientes</p>
            </div>
        </div>
        <div id="contenedorMensajes"></div>
        <form id="formBuscarExpediente">
            <div class="card"><div class="card-header"><h2>Buscar expediente</h2>
            </div>
                <div class="card-body">
                    <div class="form-grid cols-3">
                        <div class="form-group ">
                            <label for="nombrePaciente">Nombre paciente</label>
                            <input type="text" id="nombrePaciente" name="nombrePaciente" placeholder="Nombre o apellido..."/>
                        </div>
                        <div class="form-group ">
                            <label for="fechaUltimaConsulta">Última consulta (última nota de evolución)</label>
                            <input type="date" id="fechaUltimaConsulta" name="fechaUltimaConsulta"/>
                        </div>
                        <div class="form-group ">
                            <label for="ordenExpedientes">Ordenar por</label>
                            <select id="ordenExpedientes" name="orden">
                                <option value="nombre-asc" selected="selected">Nombre (A-Z)</option>
                                <option value="nombre-desc">Nombre (Z-A)</option>
                                <option value="ultimaConsulta-desc">Fecha de consulta (más reciente)</option>
                                <option value="ultimaConsulta-asc">Fecha de consulta (más antigua)</option>
                            </select>
                        </div>
                    </div>
                    <div class="btn-group" style="margin-top:14px">
                        <button type="submit" class="btn btn-primary">Buscar</button>
                        <button type="reset" class="btn btn-muted">Limpiar</button>
                    </div>
                </div>
            </div>
        </form>
        <div class="card">
            <div class="table-wrap">
                <table>
                    <thead>
                    <tr>
                        <th><a href="#" class="sort-link" data-sort="nombre" data-order="asc">Paciente <span class="sort-icon" aria-hidden="true">↕</span></a></th>
                        <th><a href="#" class="sort-link" data-sort="ultimaConsulta" data-order="desc">Fecha de consulta <span class="sort-icon" aria-hidden="true">↕</span></a></th>
                        <th>Fecha de creación</th>
                        <th>Acciones</th>
                    </tr>
                    </thead>

                    <tbody id="tablaExpedientes">
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
